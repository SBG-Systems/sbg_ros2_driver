name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve dependencies with rosdep, then run colcon build, colcon test and
  # colcon test-result --verbose for each supported ROS 2 distribution.
  # Linters run as part of colcon test through ament_lint_auto.
  #
  # The containers only ship the CI tooling, not ROS itself, so rosdep install
  # validates that package.xml declares every dependency the driver needs.
  build-test:
    name: build-test (${{ matrix.ros_distribution }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Humble Hawksbill - Ubuntu 22.04 (May 2022 - May 2027)
          - ros_distribution: humble
            container: rostooling/setup-ros-docker:ubuntu-jammy-latest

          # Jazzy Jalisco - Ubuntu 24.04 (May 2024 - May 2029)
          - ros_distribution: jazzy
            container: rostooling/setup-ros-docker:ubuntu-noble-latest

          # Lyrical Luth - Ubuntu 26.04 (May 2026 - May 2031)
          - ros_distribution: lyrical
            container: rostooling/setup-ros-docker:ubuntu-resolute-latest

    steps:
      - name: Build and test sbg_driver
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: sbg_driver
          target-ros2-distro: ${{ matrix.ros_distribution }}
          # Coverage collection is out of scope for this first CI iteration.
          coverage-result: false

  # Run the same test suite once more on Lyrical with AddressSanitizer and
  # UndefinedBehaviorSanitizer, to catch memory and undefined behaviour defects in the
  # driver and in the bundled sbgECom.
  sanitizers:
    name: sanitizers (lyrical)
    runs-on: ubuntu-24.04
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-latest
    env:
      # Fail the job on the first finding instead of only reporting it.
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Build and test sbg_driver with ASan and UBSan
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: sbg_driver
          target-ros2-distro: lyrical
          coverage-result: false
          # Instruments everything this repository compiles, the bundled sbgECom included.
          # The asan-gcc colcon mixin is deliberately not used: it only sets
          # -fsanitize=address, with no UBSan, no frame pointers and no linker flags.
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_BUILD_TYPE=Debug",
                  "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g",
                  "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g",
                  "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined",
                  "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
                ]
              }
            }

  # Run the same test suite once more on Lyrical with gcov instrumentation and publish a
  # coverage report for the driver's own sources. The percentage is informational: no
  # threshold is enforced, but the job fails if the build, the tests or the report
  # generation fail.
  #
  # Kept separate from the sanitizers job on purpose, so gcov and ASan/UBSan
  # instrumentation never mix.
  coverage:
    name: coverage (lyrical)
    runs-on: ubuntu-24.04
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-latest

    steps:
      - name: Install gcovr
        run: |
          apt-get update
          apt-get install --no-install-recommends -y gcovr

      - name: Build and test sbg_driver with coverage instrumentation
        id: build
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: sbg_driver
          target-ros2-distro: lyrical
          # gcovr is run explicitly below instead of colcon lcov-result, which
          # action-ros-ci invokes with the return code ignored and would therefore hide a
          # coverage collection failure.
          coverage-result: false
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_BUILD_TYPE=Debug",
                  "-DCMAKE_C_FLAGS=--coverage -fprofile-abs-path",
                  "-DCMAKE_CXX_FLAGS=--coverage -fprofile-abs-path",
                  "-DCMAKE_EXE_LINKER_FLAGS=--coverage",
                  "-DCMAKE_SHARED_LINKER_FLAGS=--coverage"
                ]
              }
            }

      - name: Collect coverage
        run: |
          workspace="${GITHUB_WORKSPACE}/${{ steps.build.outputs.ros-workspace-directory-name }}"
          package="$(dirname "$(find "${workspace}/src" -name package.xml | head -n 1)")"

          echo "package source directory: ${package}"
          mkdir -p coverage/html

          # The two --filter entries are an allow list, and they are what keeps /usr,
          # /opt/ros, the build and install trees, the generated interfaces,
          # external/sbgECom and test/ out of the primary report. gcovr matches filters
          # against absolute paths, hence the ${package} prefix.
          gcovr --root "${package}" "${workspace}/build/sbg_driver" \
            --filter "${package}/src/" \
            --filter "${package}/include/" \
            --print-summary \
            --txt coverage/coverage-summary.txt \
            --xml coverage/coverage-cobertura.xml \
            --lcov coverage/coverage.lcov \
            --html-details coverage/html/index.html

          # gcovr only warns when everything is filtered out, so treat an empty report as
          # a failure: it means the collection did not work.
          if ! grep -q '<class ' coverage/coverage-cobertura.xml; then
            echo "::error::no driver source file ended up in the coverage report"
            exit 1
          fi

          # Secondary report, driver plus the bundled sbgECom, for reference only.
          gcovr --root "${package}" "${workspace}/build/sbg_driver" \
            --filter "${package}/" \
            --txt coverage/coverage-summary-with-sbgecom.txt

          {
            echo '## Coverage - driver sources only'
            echo '```'
            cat coverage/coverage-summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-lyrical
          path: coverage
