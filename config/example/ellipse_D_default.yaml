#
# Example configuration for an Ellipse-D (dual-antenna GNSS).
#
# This is the only example that configures the device, to demonstrate the sbgInsRestApi
# workflow: ins.settingsFile below points at a JSON settings export document that is applied
# to the api/v1/settings/import endpoint at startup.
#
# Note: The shipped example settings file only sets a subset of the device settings. Export the
#       settings of a configured device to get a complete starting point:
#         sbgEComApi -s /dev/ttyUSB0 -r 921600 api/v1/settings/export -g
#
/**:
  ros__parameters:
    driver:
      # Node frequency (Hz)
      # Note: The frequency should be at least two times higher than the highest
      #       output frequency.
      frequency: 400

    odometry:
      # Enable ROS odometry messages.
      enable: true
      # Publish odometry transforms.
      publishTf: true
      # Odometry frame IDs.
      odomFrameId: "odom"
      baseFrameId: "base_link"
      initFrameId: "map"

    # Configuration of the device with ROS.
    confWithRos: true

    # Device configuration through the sbgInsRestApi.
    ins:
      # Path to a sbgInsRestApi JSON settings file to apply to the device at startup.
      # Note: Only used when confWithRos is true. Leave empty to skip the device configuration.
      #       The path is resolved by the driver process, so use an absolute path or a path
      #       relative to the working directory the node is launched from.
      settingsFile: "config/settings/ellipse_example.json"

    # Uart configuration
    uartConf:
      # Port Name
      portName: "/dev/ttyUSB0"

      # Baud rate (4800 ,9600 ,19200 ,38400 ,115200 [default],230400 ,460800 ,921600)
      baudRate: 921600

    magnetometer:
      # These parameters are only used for a calibration run
      calibration:
        # 1 2D limited motions, roll and pitch less than ± 5°, at least a full circle.
        # 2 3D full 3D magnetic calibration procedure, best accuracy.
        mode: 2

    ############################### Output configuration ###############################
    # Note: Which logs the device sends is configured with the sbgInsRestApi. The driver
    #       publishes every log it receives, so the parameters below only cover the ROS
    #       side of the outputs.
    output:
      # "ros" : ROS time (default)
      # "ins_unix" : INS absolute time referenced to UNIX epoch (00:00:00 UTC on 1 January 1970)
      time_reference: "ros"

      # If true publish ROS standard messages.
      ros_standard: true

      # true : ENU convention (X east, Y north, Z up)
      # false (default): NED convention (X north, Y east, Z down)
      use_enu: false

      # Frame ID, defaults to imu_link_ned in NED convention and imu_link in ENU convention.
      frame_id: "imu_link_ned"

      # Frame of the GNSS antenna, defaults to frame_id when unset.
      gps_frame_id: "gps_link"

    rtcm:
      # Should ros driver subscribe to RTCM topic
      subscribe: false
      # Topic on which RTCM is published
      topic_name: rtcm
      # Namespace where topic is published
      namespace: ntrip_client

    nmea:
      # Should ros driver publish NMEA string
      publish: false
      # Topic on which to publish nmea data
      topic_name: nmea
      # Namespace where to publish topic
      namespace: ntrip_client
