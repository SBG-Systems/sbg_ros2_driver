/**:
  ros__parameters:
    # Configuration file to replay SBG data from a log file.

    driver:
      # Node frequency (Hz)
      # Note: The frequency should be at least two times higher than the highest
      #       output frequency.
      #       The frequency can be reduced in order to reduce CPU consumption but
      #       it can lead to miss data frame and less accurate time stamping.
      frequency: 400

    odometry:
      # Enable ROS odometry messages.
      enable: false
      # Publish odometry transforms.
      publishTf: true
      # Odometry frame IDs.
      odomFrameId: "odom"
      baseFrameId: "base_link"
      initFrameId: "map"

    # Configuration of the device with ROS.
    # Note: There is no device to configure when replaying a log file, keep this to false.
    confWithRos: false

    # File configuration to replay INS data
    # can be configured by command line as defined in README
    fileConf:
      path: 'sbg_raw_data.dat'

    magnetometer:
      # These parameters are only used for a calibration run
      calibration:
        # 1 2D Tell the device that the magnetic calibration will be performed with limited motions.
        #     This calibration mode is only designed to be used when roll and pitch motions are less than ± 5°.
        #     To work correctly, the device should be rotated through at least a full circle.
        # 2 3D Tell the device to start a full 3D magnetic calibration procedure. The 3D magnetic calibration offers the best accuracy
        mode: 2

    ############################### Output configuration ###############################
    # Note: Which logs the file holds depends on how the device was configured when it was
    #       recorded. The driver publishes every log it reads, so the parameters below only
    #       cover the ROS side of the outputs.
    output:
      # Time reference:
      # Note: Set the time reference used to timestamp the header of the published
      #       messages.
      #       The header of the ROS standard message sensor_msgs:TimeReference is
      #       not effected by this parameter and it will be timestamped by the ROS time.
      #
      # "ros" : ROS time (default)
      # "ins_unix" : INS absolute time referenced to UNIX epoch (00:00:00 UTC on 1 January 1970)
      time_reference: "ros"

      # Ros standard output:
      # Note: If true publish ROS standard messages.
      ros_standard: false

      # Frame convention:
      # Note: If true messages are expressed in the ENU convention.
      #
      # true : ENU convention (X east, Y north, Z up)
      # false (default): NED convention (X north, Y east, Z down)
      use_enu: false

      # Frame ID:
      # Note: If the frame convention is NED so the default frame ID is (imu_link_ned)
      #       else if the convention is ENU so the default frame ID is (imu_link)
      frame_id: "imu_link_ned"

      # GPS frame ID:
      # Note: Frame of the GNSS antenna. GPS position, velocity and true heading
      #       logs are expressed at the antenna phase center, not at the IMU.
      #       If not set, it defaults to frame_id.
      gps_frame_id: "gps_link"

    rtcm:
      # Should ros driver subscribe to RTCM topic
      subscribe: false
      # Topic on which RTCM is published
      topic_name: rtcm
      # Namespace where topic is published
      namespace: ntrip_client

    nmea:
      # Should ros driver publish NMEA string
      publish: false
      # Topic on which to publish nmea data
      topic_name: nmea
      # Namespace where to publish topic
      namespace: ntrip_client
